<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>RetroWeb OS - IE11 Compatible</title>
    <style>
        /* Stili CSS compatibili con IE11 e vecchi browser */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 12px;
            background-color: #008080; /* Colore classico Verde Petrolio desktop */
            -ms-user-select: none;
            user-select: none;
        }

        #desktop {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Icone sul Desktop */
        .desktop-icon {
            width: 70px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            color: white;
            text-shadow: 1px 1px #000;
        }

        .icon-box {
            width: 32px;
            height: 32px;
            background: #ffffff;
            border: 1px solid #000;
            margin: 0 auto 4px auto;
            line-height: 32px;
            text-align: center;
            font-weight: bold;
            color: navy;
        }

        /* Finestre in stile Retro */
        .window {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 400px;
            height: 300px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #dfdfdf #808080 #808080 #dfdfdf;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            display: none;
        }

        .window-header {
            background: navy;
            color: white;
            padding: 4px 6px;
            font-weight: bold;
            cursor: move;
            zoom: 1; /* Fix per IE */
        }

        .window-header:after {
            content: "";
            display: block;
            clear: both;
        }

        .window-title {
            float: left;
        }

        .window-controls {
            float: right;
        }

        .window-btn {
            background: #c0c0c0;
            border: 1px solid;
            border-color: #fff #000 #000 #fff;
            width: 16px;
            height: 14px;
            font-size: 9px;
            line-height: 10px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
            color: black;
            margin-left: 2px;
        }

        .window-body {
            background: white;
            border: 1px solid;
            border-color: #808080 #fff #fff #808080;
            margin: 4px;
            height: calc(100% - 35px);
            padding: 8px;
            overflow: auto;
            box-sizing: border-box;
        }

        /* Barra delle applicazioni (Taskbar) */
        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30px;
            background: #c0c0c0;
            border-top: 2px solid #dfdfdf;
            z-index: 9999;
        }

        #start-btn {
            position: absolute;
            left: 4px;
            top: 3px;
            height: 22px;
            padding: 0 10px;
            font-weight: bold;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #000 #000 #fff;
            cursor: pointer;
        }

        #start-btn:active {
            border-color: #000 #fff #fff #000;
        }

        #clock {
            position: absolute;
            right: 8px;
            top: 6px;
            border: 1px solid;
            border-color: #808080 #fff #fff #808080;
            padding: 2px 6px;
            background: #c0c0c0;
        }

        /* Menu Start */
        #start-menu {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 180px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #000 #000 #fff;
            display: none;
            z-index: 10000;
        }

        .menu-item {
            padding: 6px 12px;
            cursor: pointer;
        }

        .menu-item:hover {
            background: navy;
            color: white;
        }
    </style>
</head>
<body>

    <div id="desktop">
        <!-- Icone -->
        <div class="desktop-icon" onclick="openWindow('notepad-win')">
            <div class="icon-box">TXT</div>
            Blocco Note
        </div>
        <div class="desktop-icon" onclick="openWindow('about-win')" style="margin-top: 10px;">
            <div class="icon-box" style="background: #ffcc00;">?</div>
            Info OS
        </div>

        <!-- Finestra 1: Blocco Note -->
        <div id="notepad-win" class="window" style="top: 30px; left: 60px;">
            <div class="window-header" onmousedown="startDrag(event, 'notepad-win')">
                <span class="window-title">Blocco Note - Senza titolo</span>
                <span class="window-controls">
                    <span class="window-btn" onclick="closeWindow('notepad-win')">X</span>
                </span>
            </div>
            <div class="window-body">
                <textarea style="width:100%; height:100%; border:none; resize:none; font-family:Tahoma; font-size:12px;" placeholder="Digita qui i tuoi appunti..."></textarea>
            </div>
        </div>

        <!-- Finestra 2: Informazioni -->
        <div id="about-win" class="window" style="top: 90px; left: 120px; width: 320px; height: 190px;">
            <div class="window-header" onmousedown="startDrag(event, 'about-win')">
                <span class="window-title">Informazioni su RetroWeb OS</span>
                <span class="window-controls">
                    <span class="window-btn" onclick="closeWindow('about-win')">X</span>
                </span>
            </div>
            <div class="window-body" style="text-align: center; padding-top: 15px;">
                <h3 style="margin: 0 0 10px 0; color: navy;">RetroWeb OS v1.0</h3>
                <p>Ambiente grafico simulato.</p>
                <p style="font-size: 11px; color: #555;">Pienamente compatibile con IE11 e vecchi browser.</p>
                <br>
                <button onclick="closeWindow('about-win')" style="padding: 4px 14px; background: #c0c0c0; border: 2px solid; border-color: #fff #000 #000 #fff; cursor: pointer;">OK</button>
            </div>
        </div>
    </div>

    <!-- Menu Start -->
    <div id="start-menu">
        <div class="menu-item" onclick="openWindow('notepad-win'); toggleStartMenu();">Blocco Note</div>
        <div class="menu-item" onclick="openWindow('about-win'); toggleStartMenu();">Informazioni</div>
        <div class="menu-item" onclick="alert('Arresto del sistema simulato completato!'); toggleStartMenu();">Spegni PC</div>
    </div>

    <!-- Barra delle applicazioni -->
    <div id="taskbar">
        <button id="start-btn" onclick="toggleStartMenu()">Start</button>
        <div id="clock">00:00:00</div>
    </div>

    <script>
        // Logica JavaScript ES5 (Compatibile con Internet Explorer 11)

        // Orologio in tempo reale
        function updateClock() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var seconds = now.getSeconds();
            
            if (hours < 10) hours = "0" + hours;
            if (minutes < 10) minutes = "0" + minutes;
            if (seconds < 10) seconds = "0" + seconds;
            
            var clockEl = document.getElementById('clock');
            if (clockEl) {
                clockEl.innerText = hours + ":" + minutes + ":" + seconds;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Apertura/Chiusura Menu Start
        function toggleStartMenu() {
            var menu = document.getElementById('start-menu');
            if (menu.style.display === 'block') {
                menu.style.display = 'none';
            } else {
                menu.style.display = 'block';
            }
        }

        // Gestione Finestre
        var highestZIndex = 100;

        function openWindow(id) {
            var win = document.getElementById(id);
            if (win) {
                win.style.display = 'block';
                highestZIndex++;
                win.style.zIndex = highestZIndex;
            }
        }

        function closeWindow(id) {
            var win = document.getElementById(id);
            if (win) {
                win.style.display = 'none';
            }
        }

        // Gestione Trascinamento Finestre (Draggable per IE11)
        var activeWindow = null;
        var startX = 0, startY = 0;
        var initialX = 0, initialY = 0;

        function startDrag(e, id) {
            activeWindow = document.getElementById(id);
            if (!activeWindow) return;

            highestZIndex++;
            activeWindow.style.zIndex = highestZIndex;

            startX = e.clientX;
            startY = e.clientY;
            
            initialX = activeWindow.offsetLeft;
            initialY = activeWindow.offsetTop;

            document.onmousemove = dragWindow;
            document.onmouseup = stopDrag;

            if (e.preventDefault) {
                e.preventDefault();
            }
        }

        function dragWindow(e) {
            if (!activeWindow) return;

            var dx = e.clientX - startX;
            var dy = e.clientY - startY;

            activeWindow.style.left = (initialX + dx) + 'px';
            activeWindow.style.top = (initialY + dy) + 'px';
        }

        function stopDrag() {
            activeWindow = null;
            document.onmousemove = null;
            document.onmouseup = null;
        }

        // Chiusura automatica del menu Start se si clicca fuori
        document.onclick = function(e) {
            var menu = document.getElementById('start-menu');
            var startBtn = document.getElementById('start-btn');
            var target = e.target || e.srcElement;
            
            if (menu.style.display === 'block' && target !== startBtn && !menu.contains(target)) {
                menu.style.display = 'none';
            }
        };
    </script>
</body>
</html>
